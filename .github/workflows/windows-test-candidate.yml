name: Build Windows test candidate

on:
  push:
    branches:
      - windows-native-release-2026-10-16
    paths:
      - .github/workflows/windows-test-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: windows-native-release-2026-10-16
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0

      - run: python -m pip install -r requirements-dev.txt
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python -m pytest -q

      - name: Build release binary
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "--remap-path-prefix=$($PWD.Path)=/sentinel-build --remap-path-prefix=$HOME\.cargo=/cargo"
          cargo build --release --locked

      - run: cargo fetch --locked
      - run: python scripts/third_party.py

      - name: Download Windows dependency
        run: python -m pip download --only-binary=:all: --no-deps --dest release-vendor pywin32==312

      - name: Package Windows candidate
        run: python scripts/build_release.py --windows-wheel release-vendor/pywin32-312-cp312-cp312-win_amd64.whl

      - run: python scripts/scan_release.py --artifacts release-artifacts
      - run: python scripts/test_install.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sentinel-windows-test-candidate
          path: release-artifacts/
