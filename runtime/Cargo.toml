[package]
name = "sentinel-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
cedar-policy = "4"
hex = "0.4"
hmac = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasmtime = { version = "49.0.0", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
