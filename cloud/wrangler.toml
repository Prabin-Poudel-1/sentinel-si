name = "sentinel-ai-cloud"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = false
[vars]
PUBLIC_ORIGIN = "http://127.0.0.1:8788"
DEV_MODE = "false"
PRODUCTION_ENABLED = "false"
[[d1_databases]]
binding = "DB"
database_name = "sentinel-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
[dev]
ip = "127.0.0.1"
port = 8788
[triggers]
crons = ["17 * * * *"]
