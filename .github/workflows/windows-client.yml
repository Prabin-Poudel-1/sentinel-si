# Explicit opt-in only: never run untrusted pull requests on a self-hosted client.
name: Windows 10 and 11 client validation
on:
  workflow_dispatch:
    inputs:
      client:
        description: Dedicated clean Windows client runner label
        type: choice
        options: [windows-10, windows-11]
        required: true
permissions:
  contents: read
jobs:
  client:
    runs-on: [self-hosted, Windows, X64, '${{ inputs.client }}']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python -m pytest -q -ra --junitxml=reports/pytest.xml
      - run: python -m scripts.platform_report --output reports/platform-validation.json
      - run: python -m control_plane.demo --output reports/phase2-demo.json
      - run: python -m benchmarks.phase2 --repetitions 3
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install chromium
      - run: |
          $env:PYTHON = 'python'
          node scripts/browser_smoke.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-${{ inputs.client }}
          path: reports/
