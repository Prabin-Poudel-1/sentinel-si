name: Public candidate security
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cloud-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0
      - run: python scripts/scan_release.py --source
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements-dev.txt -r requirements-sync.txt
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - run: npm ci --prefix cloud
      - run: npm audit --prefix cloud
      - run: npm test --prefix cloud
      - run: cargo build --locked
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: python scripts/public_e2e.py --browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-safe-test-evidence
          path: |
            reports/public-e2e.json
            reports/public-browser.json
